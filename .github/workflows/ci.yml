name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"   # weekly: catch upstream changes that break the converters

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]
      - name: Tests
        run: python -m pytest -q -rs
      - name: CLI smoke test
        shell: bash
        run: |
          oaf --home "$RUNNER_TEMP/oaf" init
          oaf --home "$RUNNER_TEMP/oaf" list
          oaf --home "$RUNNER_TEMP/oaf" validate orochi
          oaf --home "$RUNNER_TEMP/oaf" validate realm_raid
          oaf --home "$RUNNER_TEMP/oaf" validate exploration
          oaf --home "$RUNNER_TEMP/oaf" validate home
          oaf --home "$RUNNER_TEMP/oaf" validate daily_rewards
          oaf --home "$RUNNER_TEMP/oaf" validate daily_quests
          oaf --home "$RUNNER_TEMP/oaf" validate delegation
          oaf --home "$RUNNER_TEMP/oaf" validate event_boss
          oaf --home "$RUNNER_TEMP/oaf" validate foster
          oaf --home "$RUNNER_TEMP/oaf" validate regional_boss
          oaf --home "$RUNNER_TEMP/oaf" validate task_scan
          oaf --home "$RUNNER_TEMP/oaf" marathon --print-plan
          oaf --home "$RUNNER_TEMP/oaf" sync status
          oaf --home "$RUNNER_TEMP/oaf" config get llm.budget
      - name: MCP smoke test (stdio)
        shell: bash
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"list_workflows","arguments":{}}}' \
            '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"get_config","arguments":{"path":"llm.budget"}}}' \
            | oaf --home "$RUNNER_TEMP/oaf" mcp > "$RUNNER_TEMP/mcp.out"
          python tests/mcp_smoke_check.py "$RUNNER_TEMP/mcp.out"

  upstream-sync:
    name: real upstream sync (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]
      - name: oaf sync (fetch assttyys_autojs + OnmyojiAutoScript, convert, validate)
        shell: bash
        run: |
          oaf --home "$RUNNER_TEMP/oaf" sync
          oaf --home "$RUNNER_TEMP/oaf" sync show
          oaf --home "$RUNNER_TEMP/oaf" validate orochi
          oaf --home "$RUNNER_TEMP/oaf" sync
          oaf --home "$RUNNER_TEMP/oaf" sync status
      - name: Converter tests against the real checkouts
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/up"
          cp -r "$RUNNER_TEMP/oaf/upstream-src/assttyys" "$RUNNER_TEMP/up/assttyys_autojs"
          cp -r "$RUNNER_TEMP/oaf/upstream-src/oas" "$RUNNER_TEMP/up/OnmyojiAutoScript"
          OAF_UPSTREAM="$RUNNER_TEMP/up" python -m pytest -q -rs tests/test_cli_web_convert.py -k real
