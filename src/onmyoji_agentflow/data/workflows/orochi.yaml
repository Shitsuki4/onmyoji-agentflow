# 由 onmyoji_agentflow.convert.build_mvp 从 assttyys_autojs 的识别数据生成，请勿手改坐标；
# 需要调整时改 build_mvp.py 或交给 agent 监管修复（会在 git 分支上提交）。
# 识别数据来源 https://github.com/zzliux/assttyys_autojs  MIT License, Copyright (c) 2019 Chaos
format: 1
name: orochi
title: 御魂（个人）
desc: 在御魂挑战界面反复挑战，达到次数或体力不足时停止。对应 assttyys 方案「个人御魂」里的 001 准备、002 退出结算、006 御魂/御灵/秘闻挑战。
resources: [assttyys/colors.yaml]
similarity: 93
params:
  max_runs:
    default: 30
    min: 1
    max: 999
    desc: 挑战次数
  layer:
    default: 0
    min: 0
    max: 6
    desc: 八岐大蛇第几层（1-6；0 = 不动，用游戏里当前选中的层）
vars:
  runs: 0
  done: 0
  losses: 0
  pending: 0
  started: 0
  layer_set: 0
limits:
  timeout_s: 14400
  unknown_timeout_s: 60
  stuck_timeout_s: 120
  no_progress_timeout_s: 600
  max_repeat: 20
inline_resources:
  nav_soul:
    type: click
    rect: [165, 676, 195, 704]
    desc: 探索大地图底部「御魂」入口（新版界面实机坐标）
  nav_orochi_card:
    type: click
    rect: [105, 440, 145, 500]
    desc: 御魂选择界面最左边的八岐大蛇卡片（实机坐标）
counts:
  done: max_runs
states:
- id: stamina_empty
  desc: 体力不足，停止
  from: 'assttyys 002 #19'
  when:
    res: 退出结算_体力不足
  do:
  - stop: 体力不足
- id: settle_6
  desc: 结算界面：单人胜利太鼓，点击退出
  from: 'assttyys 002 #6'
  when:
    res: 退出结算_单人_胜利太鼓
  do:
  - set:
      done: done + pending
      pending: 0
      started: 0
    first: true
  - click_random: [[165, 60, 1070, 604], [165, 60, 1263, 530]]
    delay: 400
  max_repeat: 10
  progress: true
- id: settle_0
  desc: 结算界面：左上角贪吃鬼，点击退出
  from: 'assttyys 002 #0'
  when:
    res: 退出结算_左上角贪吃鬼
  do:
  - set:
      done: done + pending
      pending: 0
      started: 0
    first: true
  - click_random: [[15, 139, 83, 309], [12, 391, 93, 548], [1202, 140, 1267, 630]]
    delay: 1000
  max_repeat: 10
  progress: true
- id: settle_1
  desc: 结算界面：左上角贪吃鬼(MuMu)，点击退出
  from: 'assttyys 002 #1'
