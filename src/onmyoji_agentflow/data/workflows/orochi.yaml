  do:
  - set:
      done: done + pending
      pending: 0
      started: 0
    first: true
  - click_random: [[59, 32, 106, 662], [1192, 49, 1261, 654]]
    delay: 1000
  max_repeat: 10
  progress: true
- id: settle_lose
  desc: 单人失败太鼓，点击退出
  from: 'assttyys 002 #9'
  when:
    res: 退出结算_单人_失败太鼓
  do:
  - set:
      done: done + pending
      pending: 0
      started: 0
      losses: losses + pending
    first: true
  - click_random: [[69, 171, 170, 320], [1104, 72, 1200, 528]]
    delay: 2000
  max_repeat: 10
  progress: true
- id: settle_overflow
  desc: 御魂溢出确认框，点确认
  from: 'assttyys 002 #13'
  when:
    res: 退出结算_御魂溢出确认
  do:
  - click: [686, 398, 799, 445]
    delay: 300
  max_repeat: 5
- id: settle_cancel_box
  desc: 取消确认框，点确认
  from: 'assttyys 002 #21'
  when:
    res: 退出结算_取消确认框
  do:
  - click: [680, 411, 838, 452]
    delay: 500
  max_repeat: 5
- id: battle_manual
  desc: 战斗中是手动状态，开启自动
  from: 'assttyys 001 #1'
  when:
    res: 战斗界面_手动状态
  do:
  - set: &id001
      started: pending
    first: true
  - click: [37, 637, 86, 686]
    delay: 1000
  max_repeat: 5
- id: prepare
  desc: 准备界面，点准备
  from: 'assttyys 001 #0'
  when:
    res: 准备界面_未准备
  do:
  - set: *id001
    first: true
  - click: [1137, 542, 1228, 632]
    delay: 1000
  max_repeat: 10
- id: in_battle
  desc: 战斗中（自动），等待
  from: assttyys 资源 战斗界面
  when:
    res: 战斗界面
  do:
  - set: *id001
    first: true
  - wait: 1000
  max_repeat: 3600
- id: layer_1
  desc: 八岐大蛇挑战界面，先选第 1 层
  when:
