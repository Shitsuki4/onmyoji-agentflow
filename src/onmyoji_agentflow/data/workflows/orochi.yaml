    res: 退出结算_已打开的达摩_1
  do:
  - set:
      done: done + pending
      pending: 0
      started: 0
    first: true
  - click_random: [[15, 139, 83, 309], [12, 391, 93, 548], [1202, 140, 1267, 630]]
    delay: 1000
