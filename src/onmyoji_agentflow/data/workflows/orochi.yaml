- id: challenge_done_0
  desc: 挑战界面，次数已打满，结束
  from: 'assttyys 006 #0'
  when:
    all:
    - colors: &id003 [[1011, 595, '#e3d7c2'], [1012, 668, '#e7dac3'], [964, 591, '#543825'], [1149, 585, '#5b3d2d'], [1188, 588, '#e2d5c1'], [1153, 679, '#392418']]
    - expr: runs >= max_runs and (pending == 0 or started == 1)
  do:
  - set: &id002
      done: done + started
      pending: pending * (1 - started)
      started: 0
    first: true
  - wait: 1500
  max_repeat: 2
  on_repeat: stop
  repeat_reason: 挑战次数已打满，停止
- id: challenge_done_1
  desc: 挑战界面，次数已打满，结束
  from: 'assttyys 006 #1'
