- id: nav_orochi
  desc: 御魂选择界面（右下角「掉落日历」），点最左边的「八岐大蛇」
  when:
    all:
    - expr: runs < max_runs
    - text: 御魂
      region: [140, 15, 100, 45]
    - text: 掉落日历
      region: [1140, 665, 135, 50]
  do:
  - click: nav_orochi_card
    delay: 2500
  max_repeat: 3
- id: exit_dialog
  desc: 「确定要退出游戏？」弹框，点取消
  when:
    all:
    - text: 退出游戏
      region: [330, 315, 330, 60]
    - text: 取消
      region: [740, 415, 130, 50]
  do:
  - click_found: true
    offset: [-15, -8, 15, 8]
    delay: 1500
  max_repeat: 3
- id: nav_soul
  desc: 探索大地图，点底部「御魂」
  when:
    all:
    - expr: runs < max_runs
    - res: 探索地图界面
  do:
  - click: nav_soul
    delay: 1500
  max_repeat: 3
- id: nav_courtyard
  desc: 在庭院，点「探索」灯笼进探索大地图
  when:
    all:
    - expr: runs < max_runs
    - all:
      - text: 式神录
        region: [1080, 640, 110, 55]
      - text: 阴阳寮
        region: [515, 640, 120, 55]
    - text: 探索
      region: [250, 120, 900, 230]
  do:
  - click_found: true
    offset: [-12, -8, 12, 8]
    delay: 2500
  max_repeat: 3
