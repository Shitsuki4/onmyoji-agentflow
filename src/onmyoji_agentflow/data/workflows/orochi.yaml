    first: true
  - wait: 1500
  max_repeat: 2
  on_repeat: stop
  repeat_reason: 挑战次数已打满，停止
- id: challenge_0
  desc: 挑战界面，点挑战
  from: 'assttyys 006 #0'
  when:
    all:
    - colors: *id003
    - expr: runs < max_runs or (pending == 1 and started == 0)
  do:
  - set: *id002
    first: true
  - click: [1148, 602, 1235, 663]
    delay: 1000
  - inc: runs
    first: true
  - set: &id005
      pending: 1
      started: 0
    first: true
  max_repeat: 3
  on_repeat: stop
  repeat_reason: 连续 3 次点挑战没反应（可能体力不足），停止
  progress: true
