    first: true
  - click_random: [[15, 139, 83, 309], [12, 391, 93, 548], [1202, 140, 1267, 630]]
    delay: 1000
  max_repeat: 10
  progress: true
- id: settle_11
  desc: 结算界面：左上角统计图标，点击退出
  from: 'assttyys 002 #11'
  when:
    res: 退出结算_左上角统计图标
  do:
  - set:
      streak: '0'
    first: true
  - set:
      done: done + pending
      pending: 0
      started: 0
    first: true
  - click_random: [[1217, 106, 1272, 700], [600, 672, 1216, 712]]
    delay: 400
  max_repeat: 10
  progress: true
- id: settle_14
  desc: 结算界面：掉落物金框，点击退出
  from: 'assttyys 002 #14'
  when:
    res: 退出结算_经验金币buff_掉落物金框
  do:
  - set:
      streak: '0'
    first: true
  - set:
      done: done + pending
      pending: 0
      started: 0
    first: true
  - click_random: [[59, 32, 106, 662], [1192, 49, 1261, 654]]
    delay: 1000
  max_repeat: 10
  progress: true
- id: settle_lose
  desc: 单人失败太鼓，点击退出
  from: 'assttyys 002 #9'
  when:
    res: 退出结算_单人_失败太鼓
  do:
  - set:
      streak: streak + 1
    first: true
  - set:
      done: done + pending
      pending: 0
      started: 0
      losses: losses + pending
    first: true
  - click_random: [[69, 171, 170, 320], [1104, 72, 1200, 528]]
    delay: 2000
  max_repeat: 10
  progress: true
- id: settle_overflow
  desc: 御魂溢出确认框，点确认
  from: 'assttyys 002 #13'
  when:
    res: 退出结算_御魂溢出确认
  do:
  - click: [686, 398, 799, 445]
    delay: 300
  max_repeat: 5
- id: settle_cancel_box
  desc: 取消确认框，点确认
  from: 'assttyys 002 #21'
  when:
    res: 退出结算_取消确认框
  do:
  - click: [680, 411, 838, 452]
    delay: 500
  max_repeat: 5
- id: battle_manual
  desc: 战斗中是手动状态，开启自动
  from: 'assttyys 001 #1'
  when:
    res: 战斗界面_手动状态
  do:
  - set: &id001
      started: pending
    first: true
  - click: [37, 637, 86, 686]
    delay: 1000
  max_repeat: 5
- id: prepare
  desc: 准备界面，点准备
  from: 'assttyys 001 #0'
  when:
    res: 准备界面_未准备
  do:
  - set: *id001
    first: true
  - click: [1137, 542, 1228, 632]
    delay: 1000
  max_repeat: 10
- id: in_battle
  desc: 战斗中（自动），等待
  from: assttyys 资源 战斗界面
  when:
    res: 战斗界面
  do:
  - set: *id001
    first: true
  - wait: 1000
  max_repeat: 3600
- id: attack
  desc: 已选中结界（界面变暗），点进攻
  from: 'assttyys 008 #1 + 结界_进攻'
  when:
    all:
    - colors: [[199, 102, '#20170f'], [1206, 132, '#615a53'], [729, 50, '#1f1f22'], [1192, 81, '#1b1a1d'], [84, 167, '#594f42']]
    - find: 结界_进攻
      region: [313, 349, 1131, 696]
    - expr: runs < max_runs or (pending == 1 and started == 0)
  do:
  - click_found: true
    offset: [0, 0, 119, 49]
    delay: 2000
  - inc: runs
    first: true
  - set:
      pending: 1
      started: 0
    first: true
  max_repeat: 3
  on_repeat: stop
  repeat_reason: 连续 3 次点进攻没反应（可能突破券用完），停止
  progress: true
- id: raid_done
  desc: 回到突破界面，次数已打满，结束
  from: 'assttyys 009 #0'
  when:
    all:
    - res: 突破界面
    - expr: runs >= max_runs and (pending == 0 or started == 1)
  do:
  - set: &id002
      done: done + started
      pending: pending * (1 - started)
      started: 0
    first: true
  - wait: 1500
  max_repeat: 2
  on_repeat: stop
  repeat_reason: 进攻次数已打满，停止
- id: lose_cooling
  desc: 连续打输，刷新还在冷却，停止
  when:
    all:
    - res: 突破界面
    - expr: streak >= lose_limit and runs < max_runs
    - text: ''
      pattern: 刷新\d{1,2}[:：]\d{2}
      region: [990, 575, 130, 45]
  do:
  - wait: 1000
  max_repeat: 2
  on_repeat: stop
  repeat_reason: 连续打输，打不过本页剩下的结界，刷新还在冷却（5 分钟），停止
- id: lose_refresh
  desc: 连续打输，点「刷新」换一页
  when:
    all:
    - res: 突破界面
    - expr: streak >= lose_limit and runs < max_runs and auto_refresh == 1 and refreshes < max_refresh
    - text: 刷新
      region: [990, 575, 130, 45]
  do:
  - click_found: true
    offset: [-15, -8, 15, 8]
    delay: 1500
  - inc: refreshes
  - set:
      streak: 0
  max_repeat: 2
- id: lose_stop
  desc: 连续打输，又不能刷新，停止
  when:
    all:
    - res: 突破界面
    - expr: streak >= lose_limit and runs < max_runs
  do:
  - stop: 连续打输，打不过本页剩下的结界（没开自动刷新，或刷新次数已用完），停止
- id: medal_呱太
  desc: 突破界面，选 呱太 勋章的结界
  from: 'assttyys 009 #0'
  when:
    all:
    - res: 突破界面
    - find: 结界_呱太勋章
    - expr: runs < max_runs
  do:
  - set: *id002
    first: true
  - click_found: true
    offset: &id003 [30, 10, 160, 80]
    delay: 500
  max_repeat: 6
- id: medal_4
