# 由 onmyoji_agentflow.convert.build_mvp 从 assttyys_autojs 的识别数据生成，请勿手改坐标；
# 需要调整时改 build_mvp.py 或交给 agent 监管修复（会在 git 分支上提交）。
# 识别数据来源 https://github.com/zzliux/assttyys_autojs  MIT License, Copyright (c) 2019 Chaos
format: 1
name: realm_raid
title: 个人结界突破
desc: 在个人结界突破界面按「呱太->4->5->3->2->1->0」勋章顺序选结界并进攻，进攻连续无反应（突破券用完）或达到次数后停止；本页打完会自动刷新（冷却中就停止）。由 assttyys 008/009 翻译；「打九退四」、锁定阵容没有做。
requires: [账号已加入阴阳寮（没入寮时进不了结界突破，会提示先加入阴阳寮）]
resources: [assttyys/colors.yaml]
similarity: 93
params:
  max_runs:
    default: 30
    min: 1
    max: 300
    desc: 进攻次数上限
  auto_refresh:
    default: 1
    min: 0
    max: 1
    desc: 本页打完自动刷新（1 开 / 0 关）
  max_refresh:
    default: 3
    min: 0
    max: 50
    desc: 一次运行最多刷新几次
  lose_limit:
    default: 2
    min: 1
    max: 30
    desc: 连续打输几次就换一页（或停止）
vars:
  runs: 0
  done: 0
  losses: 0
  pending: 0
  started: 0
  refreshes: 0
  streak: 0
limits:
  timeout_s: 14400
  unknown_timeout_s: 60
  stuck_timeout_s: 120
  no_progress_timeout_s: 600
  max_repeat: 20
inline_resources:
  nav_raid:
    type: click
    rect: [266, 676, 296, 704]
    desc: 探索大地图底部「结界突破」入口（新版界面实机坐标）
counts:
  done: max_runs
states:
- id: stamina_empty
  desc: 体力不足，停止
  from: 'assttyys 002 #19'
  when:
    res: 退出结算_体力不足
  do:
  - stop: 体力不足
- id: settle_6
  desc: 结算界面：单人胜利太鼓，点击退出
  from: 'assttyys 002 #6'
  when:
    res: 退出结算_单人_胜利太鼓
  do:
  - set:
      streak: '0'
    first: true
  - set:
      done: done + pending
      pending: 0
      started: 0
    first: true
  - click_random: [[165, 60, 1070, 604], [165, 60, 1263, 530]]
    delay: 400
  max_repeat: 10
  progress: true
- id: settle_0
  desc: 结算界面：左上角贪吃鬼，点击退出
  from: 'assttyys 002 #0'
  when:
    res: 退出结算_左上角贪吃鬼
  do:
  - set:
      streak: '0'
    first: true
  - set:
      done: done + pending
      pending: 0
      started: 0
    first: true
  - click_random: [[15, 139, 83, 309], [12, 391, 93, 548], [1202, 140, 1267, 630]]
    delay: 1000
  max_repeat: 10
  progress: true
- id: settle_1
  desc: 结算界面：左上角贪吃鬼(MuMu)，点击退出
  from: 'assttyys 002 #1'
  when:
    res: 退出结算_左上角贪吃鬼_mumu
  do:
  - set:
      streak: '0'
    first: true
  - set:
      done: done + pending
      pending: 0
      started: 0
    first: true
  - click_random: [[15, 139, 83, 309], [12, 391, 93, 548], [1202, 140, 1267, 630]]
    delay: 1000
  max_repeat: 10
  progress: true
- id: settle_2
  desc: 结算界面：已打开的达摩 1，点击退出
  from: 'assttyys 002 #2'
  when:
    res: 退出结算_已打开的达摩_1
  do:
  - set:
      streak: '0'
    first: true
  - set:
      done: done + pending
      pending: 0
      started: 0
    first: true
  - click_random: [[15, 139, 83, 309], [12, 391, 93, 548], [1202, 140, 1267, 630]]
    delay: 1000
  max_repeat: 10
  progress: true
- id: settle_3
  desc: 结算界面：已打开的达摩 2，点击退出
  from: 'assttyys 002 #3'
  when:
    res: 退出结算_已打开的达摩_2
  do:
  - set:
      streak: '0'
    first: true
  - set:
      done: done + pending
      pending: 0
      started: 0
    first: true
  - click_random: [[15, 139, 83, 309], [12, 391, 93, 548], [1202, 140, 1267, 630]]
    delay: 1000
  max_repeat: 10
  progress: true
- id: settle_4
  desc: 结算界面：已打开的达摩 3，点击退出
  from: 'assttyys 002 #4'
  when:
    res: 退出结算_已打开的达摩_3
  do:
  - set:
      streak: '0'
    first: true
  - set:
      done: done + pending
      pending: 0
