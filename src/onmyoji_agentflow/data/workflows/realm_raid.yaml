# 由 onmyoji_agentflow.convert.build_mvp 从 assttyys_autojs 的识别数据生成，请勿手改坐标；
# 需要调整时改 build_mvp.py 或交给 agent 监管修复（会在 git 分支上提交）。
# 识别数据来源 https://github.com/zzliux/assttyys_autojs  MIT License, Copyright (c) 2019 Chaos
format: 1
name: realm_raid
title: 个人结界突破
desc: 在个人结界突破界面按「呱太->4->5->3->2->1->0」勋章顺序选结界并进攻，进攻连续无反应（突破券用完）或达到次数后停止。由 assttyys 008/009 翻译；「打九退四」、自动刷新、锁定阵容没有做。
requires: [账号已加入阴阳寮（没入寮时进不了结界突破，会提示先加入阴阳寮）]
resources: [assttyys/colors.yaml]
similarity: 93
params:
  max_runs:
    default: 30
    min: 1
    max: 300
    desc: 进攻次数上限
vars:
  runs: 0
  done: 0
  losses: 0
  pending: 0
  started: 0
limits:
  timeout_s: 14400
  unknown_timeout_s: 60
  stuck_timeout_s: 120
  no_progress_timeout_s: 600
  max_repeat: 20
counts:
  done: max_runs
states:
- id: stamina_empty
  desc: 体力不足，停止
  from: 'assttyys 002 #19'
  when:
    res: 退出结算_体力不足
  do:
  - stop: 体力不足
- id: settle_6
  desc: 结算界面：单人胜利太鼓，点击退出
  from: 'assttyys 002 #6'
  when:
    res: 退出结算_单人_胜利太鼓
  do:
  - set:
      done: done + pending
      pending: 0
      started: 0
    first: true
  - click_random: [[165, 60, 1070, 604], [165, 60, 1263, 530]]
    delay: 400
  max_repeat: 10
  progress: true
- id: settle_0
  desc: 结算界面：左上角贪吃鬼，点击退出
  from: 'assttyys 002 #0'
  when:
    res: 退出结算_左上角贪吃鬼
  do:
  - set:
      done: done + pending
      pending: 0
      started: 0
    first: true
  - click_random: [[15, 139, 83, 309], [12, 391, 93, 548], [1202, 140, 1267, 630]]
    delay: 1000
  max_repeat: 10
  progress: true
- id: settle_1
  desc: 结算界面：左上角贪吃鬼(MuMu)，点击退出
  from: 'assttyys 002 #1'
  when:
    res: 退出结算_左上角贪吃鬼_mumu
  do:
  - set:
      done: done + pending
      pending: 0
      started: 0
    first: true
  - click_random: [[15, 139, 83, 309], [12, 391, 93, 548], [1202, 140, 1267, 630]]
    delay: 1000
  max_repeat: 10
  progress: true
- id: settle_2
  desc: 结算界面：已打开的达摩 1，点击退出
  from: 'assttyys 002 #2'
  when:
    res: 退出结算_已打开的达摩_1
  do:
  - set:
      done: done + pending
      pending: 0
      started: 0
    first: true
  - click_random: [[15, 139, 83, 309], [12, 391, 93, 548], [1202, 140, 1267, 630]]
    delay: 1000
  max_repeat: 10
  progress: true
- id: settle_3
  desc: 结算界面：已打开的达摩 2，点击退出
  from: 'assttyys 002 #3'
  when:
    res: 退出结算_已打开的达摩_2
  do:
  - set:
      done: done + pending
      pending: 0
      started: 0
    first: true
  - click_random: [[15, 139, 83, 309], [12, 391, 93, 548], [1202, 140, 1267, 630]]
    delay: 1000
  max_repeat: 10
  progress: true
- id: settle_4
  desc: 结算界面：已打开的达摩 3，点击退出
  from: 'assttyys 002 #4'
  when:
    res: 退出结算_已打开的达摩_3
  do:
  - set:
      done: done + pending
      pending: 0
      started: 0
    first: true
  - click_random: [[15, 139, 83, 309], [12, 391, 93, 548], [1202, 140, 1267, 630]]
    delay: 1000
  max_repeat: 10
  progress: true
- id: settle_11
  desc: 结算界面：左上角统计图标，点击退出
  from: 'assttyys 002 #11'
  when:
    res: 退出结算_左上角统计图标
  do:
  - set:
      done: done + pending
      pending: 0
      started: 0
    first: true
  - click_random: [[1217, 106, 1272, 700], [600, 672, 1216, 712]]
    delay: 400
  max_repeat: 10
  progress: true
- id: settle_14
  desc: 结算界面：掉落物金框，点击退出
  from: 'assttyys 002 #14'
  when:
    res: 退出结算_经验金币buff_掉落物金框
  do:
  - set:
      done: done + pending
      pending: 0
      started: 0
    first: true
  - click_random: [[59, 32, 106, 662], [1192, 49, 1261, 654]]
    delay: 1000
  max_repeat: 10
  progress: true
- id: settle_lose
  desc: 单人失败太鼓，点击退出
  from: 'assttyys 002 #9'
  when:
    res: 退出结算_单人_失败太鼓
  do:
  - set:
      done: done + pending
      pending: 0
      started: 0
      losses: losses + pending
    first: true
  - click_random: [[69, 171, 170, 320], [1104, 72, 1200, 528]]
    delay: 2000
  max_repeat: 10
  progress: true
- id: settle_overflow
  desc: 御魂溢出确认框，点确认
  from: 'assttyys 002 #13'
  when:
    res: 退出结算_御魂溢出确认
  do:
  - click: [686, 398, 799, 445]
    delay: 300
  max_repeat: 5
- id: settle_cancel_box
  desc: 取消确认框，点确认
  from: 'assttyys 002 #21'
  when:
    res: 退出结算_取消确认框
  do:
  - click: [680, 411, 838, 452]
    delay: 500
  max_repeat: 5
- id: battle_manual
  desc: 战斗中是手动状态，开启自动
  from: 'assttyys 001 #1'
  when:
    res: 战斗界面_手动状态
  do:
  - set: &id001
      started: pending
    first: true
  - click: [37, 637, 86, 686]
    delay: 1000
  max_repeat: 5
- id: prepare
  desc: 准备界面，点准备
  from: 'assttyys 001 #0'
  when:
    res: 准备界面_未准备
  do:
  - set: *id001
    first: true
  - click: [1137, 542, 1228, 632]
    delay: 1000
  max_repeat: 10
- id: in_battle
  desc: 战斗中（自动），等待
  from: assttyys 资源 战斗界面
  when:
    res: 战斗界面
  do:
  - set: *id001
    first: true
  - wait: 1000
  max_repeat: 3600
- id: attack
  desc: 已选中结界（界面变暗），点进攻
  from: 'assttyys 008 #1 + 结界_进攻'
  when:
    all:
    - colors: [[199, 102, '#20170f'], [1206, 132, '#615a53'], [729, 50, '#1f1f22'], [1192, 81, '#1b1a1d'], [84, 167, '#594f42']]
    - find: 结界_进攻
      region: [313, 349, 1131, 696]
    - expr: runs < max_runs or (pending == 1 and started == 0)
  do:
  - click_found: true
    offset: [0, 0, 119, 49]
    delay: 2000
  - inc: runs
    first: true
  - set:
      pending: 1
      started: 0
    first: true
  max_repeat: 3
  on_repeat: stop
  repeat_reason: 连续 3 次点进攻没反应（可能突破券用完），停止
  progress: true
- id: raid_done
  desc: 回到突破界面，次数已打满，结束
  from: 'assttyys 009 #0'
  when:
    all:
    - res: 突破界面
    - expr: runs >= max_runs and (pending == 0 or started == 1)
  do:
  - set: &id002
      done: done + started
      pending: pending * (1 - started)
      started: 0
    first: true
  - wait: 1500
  max_repeat: 2
  on_repeat: stop
  repeat_reason: 进攻次数已打满，停止
- id: medal_呱太
  desc: 突破界面，选 呱太 勋章的结界
  from: 'assttyys 009 #0'
  when:
    all:
    - res: 突破界面
    - find: 结界_呱太勋章
    - expr: runs < max_runs
  do:
  - set: *id002
    first: true
  - click_found: true
    offset: &id003 [30, 10, 160, 80]
    delay: 500
  max_repeat: 6
- id: medal_4
  desc: 突破界面，选 4 勋章的结界
  from: 'assttyys 009 #0'
  when:
    all:
    - res: 突破界面
    - find: 结界_4勋章
    - expr: runs < max_runs
  do:
  - set: *id002
    first: true
  - click_found: true
    offset: *id003
    delay: 500
  max_repeat: 6
- id: medal_5
  desc: 突破界面，选 5 勋章的结界
  from: 'assttyys 009 #0'
  when:
    all:
    - res: 突破界面
    - find: 结界_5勋章
    - expr: runs < max_runs
  do:
  - set: *id002
    first: true
  - click_found: true
    offset: *id003
    delay: 500
  max_repeat: 6
- id: medal_3
  desc: 突破界面，选 3 勋章的结界
  from: 'assttyys 009 #0'
  when:
    all:
    - res: 突破界面
    - find: 结界_3勋章
    - expr: runs < max_runs
  do:
  - set: *id002
    first: true
  - click_found: true
    offset: *id003
    delay: 500
  max_repeat: 6
- id: medal_2
  desc: 突破界面，选 2 勋章的结界
  from: 'assttyys 009 #0'
  when:
    all:
    - res: 突破界面
    - find: 结界_2勋章
    - expr: runs < max_runs
  do:
  - set: *id002
    first: true
  - click_found: true
    offset: *id003
    delay: 500
  max_repeat: 6
- id: medal_1
  desc: 突破界面，选 1 勋章的结界
  from: 'assttyys 009 #0'
  when:
    all:
    - res: 突破界面
    - find: 结界_1勋章
    - expr: runs < max_runs
  do:
  - set: *id002
    first: true
  - click_found: true
    offset: *id003
    delay: 500
  max_repeat: 6
- id: medal_0
  desc: 突破界面，选 0 勋章的结界
  from: 'assttyys 009 #0'
  when:
    all:
    - res: 突破界面
    - find: 结界_0勋章
    - expr: runs < max_runs
  do:
  - set: *id002
    first: true
  - click_found: true
    offset: *id003
    delay: 500
  max_repeat: 6
- id: all_broken
  desc: 突破界面上找不到可打的结界，停止
  from: 'assttyys 009 #0'
  when:
    res: 突破界面
  do:
  - wait: 1500
  max_repeat: 3
  on_repeat: stop
  repeat_reason: 本页结界都打过了（刷新要等冷却，不自动刷新）
blockers:
- id: no_guild
  desc: 点结界突破时弹出「暂未加入任何阴阳寮，是否前往申请加入？」，或加入后还没建自己的结界时弹出「尚未创建阴阳寮结界，是否前往创建？」（两种弹框版式一样，实机截图都能认出）
  when:
    colors: [[451, 428, '#da624a'], [481, 426, '#d9614a'], [679, 422, '#e9b05e'], [688, 452, '#e9b05e'], [450, 362, '#d9c5ae'], [490, 362, '#d9c5ae'], [530, 362, '#d9c5ae'], [470, 240, '#c6b19c'], [700,
        240, '#c6b29b'], [1140, 627, '#4d472f']]
  message: 进不了个人结界突破：账号还没加入阴阳寮，或加入后还没创建自己的阴阳寮结界。请先在游戏里加入阴阳寮，并在寮里点「结界」创建结界后再运行
