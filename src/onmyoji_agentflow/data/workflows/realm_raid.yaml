- id: refresh_confirm
  desc: 「刷新后攻破记录进度将重置，确定吗？」点确定
  when:
    all:
    - text: 刷新后
      region: [400, 270, 480, 80]
    - text: 确定
      region: [690, 410, 130, 55]
  do:
  - click_found: true
    offset: [-15, -8, 15, 8]
    delay: 2000
  max_repeat: 2
- id: refresh_cooling
  desc: 本页都打过了，刷新按钮在冷却（显示倒计时），停止
  when:
    all:
    - res: 突破界面
    - expr: runs < max_runs
    - text: ''
      pattern: 刷新\d{1,2}[:：]\d{2}
      region: [990, 575, 130, 45]
  do:
  - wait: 1500
  max_repeat: 2
  on_repeat: stop
  repeat_reason: 本页结界都打过了，刷新还在冷却（5 分钟），停止
- id: refresh
  desc: 本页都打过了，点「刷新」换一页（auto_refresh=1 时）
  when:
    all:
    - res: 突破界面
    - expr: runs < max_runs and auto_refresh == 1 and refreshes < max_refresh
    - text: 刷新
      region: [990, 575, 130, 45]
  do:
  - click_found: true
    offset: [-15, -8, 15, 8]
    delay: 1500
  - inc: refreshes
  max_repeat: 2
- id: all_broken
  desc: 突破界面上找不到可打的结界，停止
  from: 'assttyys 009 #0'
  when:
    res: 突破界面
  do:
  - wait: 1500
  max_repeat: 3
  on_repeat: stop
  repeat_reason: 本页结界都打过了（没有开自动刷新，或刷新次数已用完）
- id: exit_dialog
  desc: 「确定要退出游戏？」弹框，点取消
  when:
    all:
    - text: 退出游戏
      region: [330, 315, 330, 60]
    - text: 取消
      region: [740, 415, 130, 50]
  do:
  - click_found: true
    offset: [-15, -8, 15, 8]
    delay: 1500
  max_repeat: 3
- id: nav_raid
  desc: 探索大地图，点底部「结界突破」
  when:
    all:
    - expr: runs < max_runs
    - res: 探索地图界面
  do:
  - click: nav_raid
    delay: 1500
  max_repeat: 3
- id: nav_courtyard
  desc: 在庭院，点「探索」灯笼进探索大地图
  when:
    all:
    - expr: runs < max_runs
    - all:
      - text: 式神录
        region: [1080, 640, 110, 55]
      - text: 阴阳寮
        region: [515, 640, 120, 55]
    - text: 探索
      region: [250, 120, 900, 230]
  do:
  - click_found: true
    offset: [-12, -8, 12, 8]
    delay: 2500
  max_repeat: 3
blockers:
- id: no_guild
  desc: 点结界突破时弹出「暂未加入任何阴阳寮，是否前往申请加入？」，或加入后还没建自己的结界时弹出「尚未创建阴阳寮结界，是否前往创建？」（两种弹框版式一样，实机截图都能认出）
  when:
    colors: [[451, 428, '#da624a'], [481, 426, '#d9614a'], [679, 422, '#e9b05e'], [688, 452, '#e9b05e'], [450, 362, '#d9c5ae'], [490, 362, '#d9c5ae'], [530, 362, '#d9c5ae'], [470, 240, '#c6b19c'], [700,
        240, '#c6b29b'], [1140, 627, '#4d472f']]
  message: 进不了个人结界突破：账号还没加入阴阳寮，或加入后还没创建自己的阴阳寮结界。请先在游戏里加入阴阳寮，并在寮里点「结界」创建结界后再运行
